---
listeners:
  default:
    type: tcp
    # bind to standard MQTT TCP port (1883) to avoid colliding with websocket
    bind: 0.0.0.0:1883

  ws:
    type: ws
    # WebSocket listener for browser clients (ws:// or wss://)
    bind: 0.0.0.0:9001
    # Note: amqtt's websocket listener does not accept a `path` field here
    # so clients should connect to the plain websocket URL (e.g. ws://host:9001).

timeout_disconnect_delay: 0
plugins:
  amqtt.plugins.logging_amqtt.EventLoggerPlugin:
  amqtt.plugins.logging_amqtt.PacketLoggerPlugin:
  amqtt.plugins.authentication.FileAuthPlugin:
    password_file: "passwords.txt"
  amqtt.plugins.sys.broker.BrokerSysPlugin:
    sys_interval: 20
